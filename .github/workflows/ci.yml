name: Offline driver regression
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q panasonic_vp8122a tests
      - name: Offline pytest and coverage (no physical RF bench)
        run: python -m pytest -q -m 'not hardware' --cov=panasonic_vp8122a --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Build distribution
        run: python -m pip wheel . --no-deps --wheel-dir dist
